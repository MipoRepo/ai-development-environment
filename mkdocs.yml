site_name: AI Development Environment (AIDE)
repo_url: https://github.com/MipoRepo/ai-development-environment
repo_name: ai-development-environment
docs_dir: docs
site_dir: site

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: blue
      toggle:
        icon: material/toggle-switch-off-outline
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: blue
      toggle:
        icon: material/toggle-switch
        name: Switch to light mode
  logo: assets/images/aide-transparent.png
  features:
    - navigation.expand
    - navigation.indexes
    - content.code.annotate
    - content.code.copy
    - content.tooltips
    - search.highlight
    - search.share
    - navigation.tracking
    - navigation.tabs
  font:
    text: Roboto
    code: Roboto Mono

plugins:
  - search
  - mermaid2:
      arguments:
        strict: true
        flowchart:
          diagramMargin: 10
          fontSize: 16px
  - git-revision-date-localized:
      enable_creation_date: true
      fallback_to_build_date: true
      enable_git_follow: false
  - material/tags:
      tags_file: tags.md
  - minify:
      minify_html: true
      minify_css: true
      minify_js: true

extra:
  version: 0.1.0
  docs_url: https://MipoRepo.github.io/ai-development-environment/

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascript/extra.js

