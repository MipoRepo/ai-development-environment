name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Create venv and install dependencies
        run: |
          python -m venv .venv
          source .venv/bin/activate
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov mkdocs
          pip install "mkdocs>=1.5,<1.6" "mkdocs-material" "mkdocs-mermaid2-plugin"

      - name: Run unit tests
        run: |
          source .venv/bin/activate
          pytest tests/ --cov=agents --cov-report=xml --cov-fail-under=80
          pip install codecov
          codecov

      - name: Build mkdocs site
        run: |
          source .venv/bin/activate
          mkdocs build --strict
